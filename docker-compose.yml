services:
  app:
    # Debian, not Alpine: the local Workers runtime (workerd) needs glibc.
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: sh -c "npm install && npm run dev -- --host"
